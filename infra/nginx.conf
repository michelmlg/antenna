server {
  listen 80;

  root /usr/share/nginx/html;
  index index.html;

  # SPA
  location / {
    try_files $uri /index.html;
  }

  # API + SSE
  location /api/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    # $http_host preserva a PORTA do request (rotas IPTV/EPG ecoam esse host
    # nas URLs do M3U — $host descarta a porta e o Jellyfin cairia na 80)
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location /api/v1/events {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
  }

  # HLS do MediaMTX (mesma origem -> sem CORS no player)
  # proxy_redirect: o MediaMTX responde a primeira chamada com 302 (cookie check)
  # para /antenna/... — reescreve para /hls/...; absolute_redirect mantém o
  # Location RELATIVO (senão o nginx gera URL absoluta na porta 80 e o player falha).
  location /hls/ {
    proxy_pass http://mediamtx:8080/;
    proxy_redirect / /hls/;
    absolute_redirect off;
    proxy_set_header Host $host;
    proxy_buffering off;
  }
}
