server {
  listen 80;

  # DNS do Docker resolvido em runtime (não no boot): o nginx sobe mesmo que
  # api/mediamtx ainda não existam, e re-resolve se o IP mudar após down/up.
  # Por isso o proxy_pass usa variável (sem variável o nginx resolve no start
  # e morre com "host not found in upstream").
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $api_upstream http://api:3001;
  set $mtx_upstream http://mediamtx:8080;

  root /usr/share/nginx/html;
  index index.html;

  # SPA
  location / {
    try_files $uri /index.html;
  }

  # API + SSE
  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    # $http_host preserva a PORTA do request (rotas IPTV/EPG ecoam esse host
    # nas URLs do M3U — $host descarta a porta e o Jellyfin cairia na 80)
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location /api/v1/events {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
  }

  # HLS do MediaMTX (mesma origem -> sem CORS no player)
  # proxy_redirect: o MediaMTX responde a primeira chamada com 302 (cookie check)
  # para /antenna/... — reescreve para /hls/...; absolute_redirect mantém o
  # Location RELATIVO (senão o nginx gera URL absoluta na porta 80 e o player falha).
  location /hls/ {
    rewrite ^/hls/(.*)$ /$1 break;
    proxy_pass $mtx_upstream;
    proxy_redirect / /hls/;
    absolute_redirect off;
    proxy_set_header Host $host;
    # secret CDN do MediaMTX: pulamos o cookie-check (302) no proxy — clientes
    # ffmpeg com -reconnect (Jellyfin) recebem 200 direto, sem dança de cookie
    proxy_set_header Authorization "Bearer antenna-cdn-hls-7Kx92mQz";
    proxy_buffering off;
  }
}
