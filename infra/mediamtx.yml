# MediaMTX — config mínima do Antenna (reaproveitada do v1)
logLevel: info

# API de controle (espectadores em tempo real p/ o painel)
api: true
apiAddress: :9997
apiAllowOrigins: ["*"]

# LAN aberta: o backend chama de outro container
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback
      - action: api

rtsp: yes
rtspAddress: :8554

hls: yes
hlsAddress: :8080
hlsAllowOrigins: ["*"]
# variante clássica (MPEG-TS): compatibilidade máxima com hls.js
hlsVariant: mpegts

rtmp: yes
rtmpAddress: :1935

# Secret CDN: clientes que mandam 'Authorization: Bearer <secret>' pulam o
# cookie-check do HLS (302) — necessário p/ ffmpeg com -reconnect (Jellyfin),
# que perde o cookie no reconnect e recebe playlists vazias.
hlsCDNSecret: "antenna-cdn-hls-7Kx92mQz"

# Muxer HLS sempre vivo: sobrevive à troca de publicadores (o worker troca de
# mídia sem destruir o muxer/sessões dos leitores — sem 404 pra quem assiste).
hlsAlwaysRemux: true

paths:
  # canal principal — o FFmpeg do worker publica aqui
  antenna:
